 {n:'Magma Foundry',k:'walk',early:'knight',kn:4,wi:5,wd:1.7,seed:103,len:130,lava:1,sub:'Ride the moving platforms over the lava. Swat the fireballs!'},
 {n:'Iron Stronghold',k:'fort',seed:8,len:300,dens:2.5,boss:2,sub:'Lord Bucketon waits at the end on his hover pod. Shoot him when he lifts his visor!'},
 {n:'Light Ring Vault',k:'walk',kn:6,knSquad:1,lord:1,wi:2,wd:2,seed:9,len:135,fin:1,sub:'Lord Bucketon guards the Light Ring! Swing your Lazord to bounce his lasers back at him.'},

const SPARE_STAGES=[
 {n:'Nebula Gauntlet',k:'space',seed:4,kills:14,dens:1,sub:'A bigger raider squadron. Dodge their shots!'},
 {n:'Forge Deck',k:'fort',seed:6,len:280,dens:2,boss:0,sub:'Missile silos and gun turrets everywhere. Watch your fuel!'},

 const end=st.len;
 while(z<end-14){

   let x=0,tries=0;do{x=.9+R()*6.2;tries++}while(tries<20&&used.some(u=>Math.abs(u-x)<1.3));used.push(x);

   if(i===0)k='fuel';else{const r=R();k=r<.3?'fuel':r<.58+d*.03?'turret':r<.75?'radar':(d>=.5||sd>0||z>80)?'silo':'turret'}

 else G.endZ=end+5}
function addObj(k,x,z){const o={k,x,z,alive:true,t:Math.random()*6,fireT:1+Math.random()*1.5,y:0,vy:0,launched:false};
 Object.assign(o,{fuel:{w:.42,h:1,dd:.42},turret:{w:.45,h:.9,dd:.45},radar:{w:.45,h:1.45,dd:.4},silo:{w:.35,h:1.2,dd:.35}}[k]);G.objs.push(o);return o}
// free altitude intervals of a wall at lateral x (for the altimeter helper and the bot)
function freeAlts(w,x,m){m=m||0;const bl=w.b.filter(q=>x>q.x0-m-.42&&x<q.x1+m+.42).map(q=>[q.y0,q.y1]).sort((a,b)=>a[0]-b[0]);const out=[];let a=ALTMIN;

function setCam(top,bot){const port=H>W*1.12;CAM.port=port;let F,L,u;

/* Firestore over REST (no SDK). Docs: boards/{board}/scores/{pid}. One doc per player per board; rules only let k go up. */

const boardLabel=b=>{const x=(G.boards||[]).find(o=>o.id===b);return x?x.label:''};

const SRC={online:'🌐 Live scores from everyone',offline:'📴 Offline — showing scores saved on this phone',local:'📱 Scores saved on this phone'};

  lastShown=b;head(o.heading||G.overTitle||'GAME OVER',G.title+(boardLabel(b)?' · '+boardLabel(b):''));
  card.append($('div',{},o.label||'Your score'),$('div',{class:'big'},fmt(score)),$('div',{class:'note'},o.best!=null?(o.label?'':'Best: '+fmt(pv)+(o.newBest?'  ★ New best! ★':'')):isPB?(pb==null?'':'★ New personal best! ★'):'Your best: '+fmt(pb)));

  const err=$('div',{class:'err'});const save=$('button',{type:'button',class:'b'},'🏆 Save score'),skip=$('button',{type:'button',class:'b alt'},'Skip');
